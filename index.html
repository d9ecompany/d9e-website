<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>D9E Clothing | Modern Fashion</title>
  <meta name="description" content="D9E Clothing - Modern everyday fashion for men and women.">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#fff;
      color:#111;
      line-height:1.5;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    .topbar{
      background:#111;
      color:#fff;
      text-align:center;
      padding:9px 15px;
      font-size:12px;
      letter-spacing:.5px;
    }

    .header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#fff;
      border-bottom:1px solid #eee;
    }

    .header-inner{
      max-width:1400px;
      margin:auto;
      min-height:70px;
      padding:0 25px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }

    .logo{
      font-size:27px;
      font-weight:900;
      letter-spacing:2px;
      white-space:nowrap;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:28px;
      font-size:14px;
      font-weight:600;
    }

    .nav a:hover{
      text-decoration:underline;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .icon-btn{
      width:40px;
      height:40px;
      border:0;
      background:transparent;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
      position:relative;
    }

    .icon-btn:hover{
      background:#f4f4f4;
    }

    .badge{
      position:absolute;
      top:0;
      right:0;
      min-width:17px;
      height:17px;
      padding:0 4px;
      border-radius:20px;
      background:#111;
      color:#fff;
      font-size:10px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .menu-btn{
      display:none;
    }

    .hero{
      min-height:620px;
      background:
        linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,.32)),
        url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:40px 20px;
    }

    .hero-content{
      max-width:750px;
    }

    .hero small{
      font-size:13px;
      letter-spacing:3px;
      font-weight:700;
    }

    .hero h1{
      font-size:clamp(45px,8vw,90px);
      line-height:.95;
      margin:20px 0;
      font-weight:900;
    }

    .hero p{
      font-size:17px;
      margin-bottom:28px;
    }

    .btn{
      border:1px solid #111;
      background:#111;
      color:#fff;
      padding:14px 25px;
      min-height:48px;
      font-weight:700;
      transition:.2s;
    }

    .btn:hover{
      background:#333;
    }

    .btn-light{
      background:#fff;
      color:#111;
      border-color:#fff;
    }

    .btn-light:hover{
      background:#eee;
    }

    .section{
      max-width:1400px;
      margin:auto;
      padding:70px 25px;
    }

    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:30px;
    }

    .section-title{
      font-size:32px;
      font-weight:800;
    }

    .section-subtitle{
      color:#666;
      font-size:14px;
      margin-top:5px;
    }

    .categories{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
    }

    .category{
      min-height:300px;
      position:relative;
      overflow:hidden;
      background:#eee;
      cursor:pointer;
    }

    .category img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.4s;
    }

    .category:hover img{
      transform:scale(1.04);
    }

    .category-overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(transparent,rgba(0,0,0,.7));
      display:flex;
      align-items:end;
      padding:25px;
      color:#fff;
    }

    .category-title{
      font-size:25px;
      font-weight:800;
    }

    .shop-tools{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:25px;
    }

    .search-box{
      flex:1;
      min-width:230px;
      position:relative;
    }

    .search-box input{
      width:100%;
      height:48px;
      border:1px solid #ccc;
      padding:0 15px;
      outline:none;
    }

    .search-box input:focus{
      border-color:#111;
    }

    .select{
      height:48px;
      min-width:170px;
      border:1px solid #ccc;
      background:#fff;
      padding:0 12px;
      outline:none;
    }

    .filter-buttons{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:30px;
    }

    .filter-btn{
      border:1px solid #ddd;
      background:#fff;
      padding:10px 17px;
      font-size:13px;
    }

    .filter-btn.active,
    .filter-btn:hover{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .product{
      position:relative;
      cursor:pointer;
      min-width:0;
    }

    .product-image{
      aspect-ratio:3/4;
      background:#f2f2f2;
      overflow:hidden;
      position:relative;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.35s;
    }

    .product:hover .product-image img{
      transform:scale(1.035);
    }

    .product-badge{
      position:absolute;
      left:10px;
      top:10px;
      background:#fff;
      padding:6px 9px;
      font-size:10px;
      font-weight:800;
      z-index:2;
    }

    .wishlist{
      position:absolute;
      right:10px;
      top:10px;
      width:38px;
      height:38px;
      border:0;
      background:#fff;
      border-radius:50%;
      z-index:3;
      font-size:18px;
    }

    .product-info{
      padding:12px 2px 25px;
    }

    .product-name{
      font-size:14px;
      font-weight:600;
    }

    .product-category{
      color:#777;
      font-size:12px;
      margin:4px 0;
    }

    .product-price{
      font-size:14px;
      font-weight:800;
    }

    .old-price{
      color:#999;
      text-decoration:line-through;
      font-weight:400;
      margin-left:6px;
    }

    .empty{
      padding:50px 20px;
      text-align:center;
      color:#666;
      grid-column:1/-1;
    }

    .features{
      border-top:1px solid #eee;
      border-bottom:1px solid #eee;
      display:grid;
      grid-template-columns:repeat(4,1fr);
    }

    .feature{
      padding:35px 20px;
      text-align:center;
      border-right:1px solid #eee;
    }

    .feature:last-child{
      border-right:0;
    }

    .feature-icon{
      font-size:28px;
      margin-bottom:10px;
    }

    .feature h3{
      font-size:15px;
      margin-bottom:5px;
    }

    .feature p{
      font-size:12px;
      color:#777;
    }

    .newsletter{
      background:#f5f5f5;
      text-align:center;
    }

    .newsletter-inner{
      max-width:600px;
      margin:auto;
    }

    .newsletter h2{
      font-size:30px;
      margin-bottom:10px;
    }

    .newsletter p{
      color:#666;
      margin-bottom:20px;
    }

    .newsletter-form{
      display:flex;
      gap:8px;
    }

    .newsletter-form input{
      flex:1;
      min-width:0;
      height:48px;
      border:1px solid #ccc;
      padding:0 15px;
    }

    footer{
      background:#111;
      color:#fff;
    }

    .footer-inner{
      max-width:1400px;
      margin:auto;
      padding:55px 25px;
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr;
      gap:40px;
    }

    .footer-brand h2{
      font-size:28px;
      margin-bottom:12px;
    }

    .footer-brand p{
      color:#aaa;
      max-width:360px;
      font-size:13px;
    }

    .footer-col h3{
      font-size:13px;
      margin-bottom:15px;
    }

    .footer-col a{
      display:block;
      color:#aaa;
      font-size:13px;
      margin:9px 0;
    }

    .footer-col a:hover{
      color:#fff;
    }

    .copyright{
      border-top:1px solid #333;
      text-align:center;
      padding:20px;
      color:#888;
      font-size:12px;
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.5);
      z-index:2000;
      display:none;
    }

    .overlay.show{
      display:block;
    }

    .drawer{
      position:fixed;
      right:0;
      top:0;
      bottom:0;
      width:min(450px,100%);
      background:#fff;
      z-index:2100;
      transform:translateX(100%);
      transition:.3s;
      display:flex;
      flex-direction:column;
    }

    .drawer.open{
      transform:translateX(0);
    }

    .drawer-head{
      min-height:70px;
      padding:0 20px;
      border-bottom:1px solid #eee;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .drawer-head h2{
      font-size:19px;
    }

    .close-btn{
      border:0;
      background:transparent;
      font-size:25px;
      width:40px;
      height:40px;
    }

    .drawer-body{
      flex:1;
      overflow:auto;
      padding:20px;
    }

    .drawer-footer{
      border-top:1px solid #eee;
      padding:20px;
    }

    .cart-item{
      display:grid;
      grid-template-columns:75px 1fr auto;
      gap:12px;
      padding:15px 0;
      border-bottom:1px solid #eee;
    }

    .cart-item img{
      width:75px;
      height:95px;
      object-fit:cover;
      background:#eee;
    }

    .cart-item-name{
      font-size:13px;
      font-weight:700;
    }

    .cart-item-meta{
      color:#777;
      font-size:11px;
      margin:4px 0;
    }

    .qty-control{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:8px;
    }

    .qty-control button{
      width:28px;
      height:28px;
      border:1px solid #ddd;
      background:#fff;
    }

    .remove{
      border:0;
      background:none;
      color:#999;
      font-size:11px;
      margin-top:7px;
    }

    .total-row{
      display:flex;
      justify-content:space-between;
      margin:8px 0;
      font-size:13px;
    }

    .total-row.final{
      font-size:18px;
      font-weight:800;
      padding-top:10px;
      border-top:1px solid #eee;
      margin-top:15px;
    }

    .full-btn{
      width:100%;
      margin-top:15px;
    }

    .modal-wrap{
      position:fixed;
      inset:0;
      z-index:2200;
      display:none;
      align-items:center;
      justify-content:center;
      padding:15px;
    }

    .modal-wrap.show{
      display:flex;
    }

    .modal{
      width:min(600px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      position:relative;
    }

    .modal-head{
      padding:20px;
      border-bottom:1px solid #eee;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .modal-head h2{
      font-size:20px;
    }

    .modal-body{
      padding:20px;
    }

    .form-group{
      margin-bottom:15px;
    }

    .form-group label{
      display:block;
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea{
      width:100%;
      border:1px solid #ccc;
      padding:12px;
      outline:none;
      background:#fff;
    }

    .form-group textarea{
      min-height:90px;
      resize:vertical;
    }

    .form-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .login-note{
      color:#777;
      font-size:12px;
      margin-bottom:20px;
    }

    .product-modal{
      width:min(950px,100%);
    }

    .product-detail{
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    .product-detail-image{
      min-height:500px;
      background:#eee;
    }

    .product-detail-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .product-detail-info{
      padding:35px;
    }

    .product-detail-info h2{
      font-size:28px;
      margin-bottom:8px;
    }

    .detail-price{
      font-size:20px;
      font-weight:800;
      margin:15px 0;
    }

    .option-title{
      font-size:12px;
      font-weight:800;
      margin:20px 0 8px;
    }

    .options{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .option{
      border:1px solid #ccc;
      background:#fff;
      padding:10px 15px;
      font-size:12px;
    }

    .option.selected{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .detail-qty{
      display:flex;
      align-items:center;
      gap:12px;
      margin:20px 0;
    }

    .detail-qty button{
      width:36px;
      height:36px;
      border:1px solid #ccc;
      background:#fff;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translate(-50%,20px);
      background:#111;
      color:#fff;
      padding:13px 20px;
      font-size:13px;
      z-index:5000;
      opacity:0;
      pointer-events:none;
      transition:.25s;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media(max-width:1000px){
      .nav{
        gap:15px;
      }

      .products{
        grid-template-columns:repeat(3,1fr);
      }

      .categories{
        grid-template-columns:repeat(2,1fr);
      }

      .footer-inner{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:750px){
      .header-inner{
        min-height:60px;
        padding:0 15px;
      }

      .nav{
        display:none;
        position:absolute;
        top:60px;
        left:0;
        right:0;
        background:#fff;
        border-bottom:1px solid #eee;
        padding:15px;
        flex-direction:column;
        align-items:flex-start;
      }

      .nav.open{
        display:flex;
      }

      .menu-btn{
        display:flex;
      }

      .header-actions{
        margin-left:auto;
      }

      .hero{
        min-height:520px;
      }

      .section{
        padding:50px 15px;
      }

      .products{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
      }

      .categories{
        grid-template-columns:1fr 1fr;
        gap:10px;
      }

      .category{
        min-height:220px;
      }

      .features{
        grid-template-columns:1fr 1fr;
      }

      .feature{
        border-bottom:1px solid #eee;
      }

      .footer-inner{
        grid-template-columns:1fr 1fr;
        padding:40px 15px;
        gap:30px 20px;
      }

      .product-detail{
        grid-template-columns:1fr;
      }

      .product-detail-image{
        min-height:350px;
      }

      .product-detail-info{
        padding:25px;
      }

      .newsletter-form{
        flex-direction:column;
      }
    }

    @media(max-width:480px){
      .logo{
        font-size:22px;
      }

      .header-actions{
        gap:2px;
      }

      .icon-btn{
        width:35px;
        height:35px;
      }

      .hero h1{
        font-size:48px;
      }

      .section-title{
        font-size:26px;
      }

      .categories{
        grid-template-columns:1fr 1fr;
      }

      .category-title{
        font-size:19px;
      }

      .products{
        gap:10px;
      }

      .product-info{
        padding-bottom:15px;
      }

      .features{
        grid-template-columns:1fr;
      }

      .feature{
        border-right:0;
      }

      .footer-inner{
        grid-template-columns:1fr;
      }

      .form-row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    FREE DELIVERY ON ORDERS ABOVE ₹999
  </div>

  <header class="header">
    <div class="header-inner">

      <button class="icon-btn menu-btn" onclick="toggleMenu()">☰</button>

      <a href="#home" class="logo">D9E</a>

      <nav class="nav" id="mainNav">
        <a href="#home" onclick="closeMenu()">Home</a>
        <a href="#shop" onclick="setCategory('Men');closeMenu()">Men</a>
        <a href="#shop" onclick="setCategory('Women');closeMenu()">Women</a>
        <a href="#shop" onclick="setCategory('New');closeMenu()">New Arrivals</a>
        <a href="#features" onclick="closeMenu()">Help</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" onclick="focusSearch()" title="Search">⌕</button>
        <button class="icon-btn" onclick="openWishlist()" title="Wishlist">
          ♡
          <span class="badge" id="wishlistCount">0</span>
        </button>
        <button class="icon-btn" onclick="openAccount()" title="Account">♙</button>
        <button class="icon-btn" onclick="openCart()" title="Cart">
          🛍
          <span class="badge" id="cartCount">0</span>
        </button>
      </div>

    </div>
  </header>

  <main id="home">

    <section class="hero">
      <div class="hero-content">
        <small>D9E CLOTHING</small>
        <h1>WEAR YOUR OWN WAY.</h1>
        <p>Clean. Modern. Everyday fashion made for your style.</p>
        <button class="btn btn-light" onclick="goShop()">SHOP NOW</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h2 class="section-title">Shop by category</h2>
          <p class="section-subtitle">Find your everyday essentials.</p>
        </div>
      </div>

      <div class="categories">

        <div class="category" onclick="setCategory('Men')">
          <img src="https://images.unsplash.com/photo-1617137968427-85924c800a22?auto=format&fit=crop&w=900&q=80" alt="Men">
          <div class="category-overlay">
            <div class="category-title">Men</div>
          </div>
        </div>

        <div class="category" onclick="setCategory('Women')">
          <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=900&q=80" alt="Women">
          <div class="category-overlay">
            <div class="category-title">Women</div>
          </div>
        </div>

        <div class="category" onclick="setCategory('T-Shirts')">
          <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80" alt="T-Shirts">
          <div class="category-overlay">
            <div class="category-title">T-Shirts</div>
          </div>
        </div>

        <div class="category" onclick="setCategory('Hoodies')">
          <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=80" alt="Hoodies">
          <div class="category-overlay">
            <div class="category-title">Hoodies</div>
          </div>
        </div>

      </div>
    </section>

    <section class="section" id="shop">

      <div class="section-head">
        <div>
          <h2 class="section-title">Shop D9E</h2>
          <p class="section-subtitle" id="resultText">All products</p>
        </div>
      </div>

      <div class="shop-tools">

        <div class="search-box">
          <input
            id="searchInput"
            type="search"
            placeholder="Search products..."
            oninput="renderProducts()"
          >
        </div>

        <select class="select" id="sortSelect" onchange="renderProducts()">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="priceLow">Price: Low to High</option>
          <option value="priceHigh">Price: High to Low</option>
          <option value="name">Name</option>
        </select>

      </div>

      <div class="filter-buttons">
